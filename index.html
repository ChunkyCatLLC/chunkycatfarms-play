<!DOCTYPE html>
<!-- Chunky Cat Farms' own web page (Unity WebGL template, chosen by the "build web" step in Editor/Screenshots.cs).
     The game fills the window; on a phone it can be added to the home screen, where it opens full screen with the
     game's icon. No service worker, so a new build is picked up on the next visit. Held upright, a phone is asked to
     turn sideways (the game is landscape). -->
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Chunky Cat Farms</title>
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Chunky Cat Farms">
    <meta name="theme-color" content="#7cc35a">
    <link rel="apple-touch-icon" href="TemplateData/icon_180.png">
    <link rel="icon" type="image/png" href="TemplateData/icon_192.png">
    <link rel="manifest" href="manifest.webmanifest">
    <style>
      html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #7cc35a; }
      body { position: fixed; inset: 0; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
      #unity-canvas { position: fixed; left: 0; top: 0; width: 100vw; height: 100vh; height: 100dvh; display: block; touch-action: none; outline: none; background: #7cc35a; }
      #loading { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px;
                 background: #fbf3dc; font-family: -apple-system, "Segoe UI", sans-serif; color: #33261a; }
      #loading img { width: 120px; height: 120px; border-radius: 26px; box-shadow: 0 6px 18px rgba(94, 58, 30, 0.25); }
      #loading h1 { margin: 0; font-size: 24px; color: #c0392b; }
      #bar { width: min(320px, 70vw); height: 14px; border-radius: 7px; background: #e6d4a8; overflow: hidden; }
      #fill { width: 0%; height: 100%; border-radius: 7px; background: #f4b41a; transition: width 0.2s; }
      #note { font-size: 13px; color: #6f5c47; text-align: center; padding: 0 24px; }
      #turn { position: fixed; inset: 0; display: none; flex-direction: column; align-items: center; justify-content: center; gap: 14px;
              background: #fbf3dc; font-family: -apple-system, "Segoe UI", sans-serif; color: #33261a; text-align: center; padding: 24px; z-index: 10; }
      #turn .phone { font-size: 64px; animation: tip 2s ease-in-out infinite; }
      @keyframes tip { 0%, 30% { transform: rotate(0deg); } 60%, 100% { transform: rotate(-90deg); } }
      @media (orientation: portrait) and (pointer: coarse) { #turn { display: flex; } }
    </style>
  </head>
  <body>
    <canvas id="unity-canvas" tabindex="-1"></canvas>
    <div id="loading">
      <img src="TemplateData/icon_180.png" alt="">
      <h1>Chunky Cat Farms</h1>
      <div id="bar"><div id="fill"></div></div>
      <div id="note">Loading the farm...</div>
    </div>
    <div id="turn">
      <div class="phone">&#x1F4F1;</div>
      <div><b>Turn your phone sideways</b><br>Chunky Cat Farms is played with the phone on its side.</div>
    </div>
    <script>
      var mobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent) || (navigator.maxTouchPoints > 1 && /Macintosh/.test(navigator.userAgent));
      var buildUrl = "Build";
      var config = {
        dataUrl: buildUrl + "/0ad51afa195ef3c43bdd6246c8d5c75a.data.unityweb",
        frameworkUrl: buildUrl + "/2215476f7262ba540f131e6327f96e39.framework.js.unityweb",
        codeUrl: buildUrl + "/09de25f3a4ac5890908919a058e47997.wasm.unityweb",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "DefaultCompany",
        productName: "Chunky Cat Farms",
        productVersion: "1.0",
        // Phones draw at up to 1.5 pixels per screen point (an iPhone's 3 would be four times the work for little gain).
        devicePixelRatio: mobile ? Math.min(window.devicePixelRatio || 1, 1.5) : (window.devicePixelRatio || 1),
        showBanner: function (msg, type) { if (type === "error") document.getElementById("note").textContent = msg; },
      };
      var script = document.createElement("script");
      script.src = buildUrl + "/737e2f0219ed05e41b4f32e4aa3e65e3.loader.js";
      script.onload = function () {
        createUnityInstance(document.getElementById("unity-canvas"), config, function (progress) {
          document.getElementById("fill").style.width = (100 * progress) + "%";
        }).then(function () {
          document.getElementById("loading").style.display = "none";
        }).catch(function (message) {
          document.getElementById("note").textContent = "The farm could not start: " + message;
        });
      };
      document.body.appendChild(script);
    </script>
  </body>
</html>
